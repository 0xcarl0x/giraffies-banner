<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giraffies Club - Banner Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0f0f1a; min-height:100vh; font-family:Nunito,sans-serif; color:white; padding:24px 16px; }
h1 { font-family:"Fredoka One",cursive; font-size:2rem; text-align:center; color:#f9c74f; text-shadow:2px 2px 0 #333; margin-bottom:2px; }
.sub { text-align:center; color:#aaa; font-size:.82rem; margin-bottom:20px; letter-spacing:3px; text-transform:none; }
.card { background:#1a1a2e; border:1px solid #2a2a4a; border-radius:14px; padding:18px; margin:0 auto 14px; max-width:860px; }
.card h2 { font-family:"Fredoka One",cursive; color:#f9c74f; font-size:1rem; margin-bottom:12px; }
.bg-picker { display:flex; gap:12px; flex-wrap:wrap; }
.bg-thumb { cursor:pointer; border-radius:8px; overflow:hidden; border:3px solid transparent; transition:border .2s; }
.bg-thumb canvas { display:block; width:160px; height:54px; }
.bg-thumb span { display:block; text-align:center; font-size:.7rem; padding:4px; color:#888; background:#0f0f1a; }
.bg-thumb.active { border-color:#f9c74f; }
.bg-thumb.active span { color:#f9c74f; font-weight:700; }
.slots { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; }
.slot { background:#12122a; border:1px solid #2a2a4a; border-radius:10px; padding:12px; }
.slot .slabel { font-size:.65rem; color:#f9c74f; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
.slot .ssize { font-size:.6rem; color:#555; margin-bottom:8px; }
.slot input { width:100%; padding:8px; border-radius:8px; border:1.5px solid #2a2a4a; background:#0f0f1a; color:white; font-family:Nunito,sans-serif; font-weight:700; font-size:.9rem; text-align:center; outline:none; }
.slot input:focus { border-color:#f9c74f; }
.text-row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
.tfield { display:flex; flex-direction:column; gap:5px; flex:1; min-width:200px; }
.tfield label { font-size:.7rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.tfield input { padding:9px 12px; border-radius:8px; border:1.5px solid #2a2a4a; background:#0f0f1a; color:white; font-family:"Fredoka One",cursive; font-size:1.1rem; outline:none; }
.tfield input:focus { border-color:#f9c74f; }
.ctrl { display:flex; flex-direction:column; gap:5px; }
.ctrl label { font-size:.7rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.ctrl input[type=range] { width:130px; accent-color:#f9c74f; cursor:pointer; }
.val { font-size:.72rem; color:#f9c74f; font-weight:700; text-align:center; margin-top:2px; }
.btn { padding:11px 28px; border-radius:50px; border:none; cursor:pointer; font-family:"Fredoka One",cursive; font-size:1rem; transition:all .2s; }
.btn-purple { background:linear-gradient(135deg,#7c3aed,#4a1d8c); color:white; }
.btn-green { background:linear-gradient(135deg,#10b981,#059669); color:white; }
.btn:hover { transform:translateY(-2px); opacity:.9; }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; max-width:860px; margin:0 auto 14px; }
.canvas-wrap { max-width:860px; margin:0 auto 14px; border-radius:10px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.6); border:2px solid #2a2a4a; }
.canvas-wrap canvas { width:100%; height:auto; display:block; }
.log { max-width:860px; margin:0 auto 30px; background:#0a0a15; border-radius:8px; padding:10px 14px; font-size:.72rem; font-family:monospace; max-height:130px; overflow-y:auto; border:1px solid #1a1a3a; }
.ok{color:#4ade80;} .er{color:#f87171;} .in{color:#94a3b8;} .wn{color:#fbbf24;}
</style>
</head>
<body>
<h1>GIRAFFIES CLUB</h1>
<p class="sub">TIP JAR: 0xa042EF3C71A3191Ef16b0F6bb2829a8F6D4762Cd</p>

<div class="card">
  <h2>Background</h2>
  <div class="bg-picker" id="bgPicker"></div>
</div>

<div class="card">
  <h2>Giraffes - Token IDs</h2>
  <div class="slots">
    <div class="slot"><div class="slabel">Far Left</div><div class="ssize">Large</div><input type="number" id="g0" placeholder="Token ID" min="1" max="3333"></div>
    <div class="slot"><div class="slabel">Mid Left</div><div class="ssize">Medium</div><input type="number" id="g1" placeholder="Token ID" min="1" max="3333"></div>
    <div class="slot"><div class="slabel">Mid Right</div><div class="ssize">Medium</div><input type="number" id="g2" placeholder="Token ID" min="1" max="3333"></div>
    <div class="slot"><div class="slabel">Far Right</div><div class="ssize">Large</div><input type="number" id="g3" placeholder="Token ID" min="1" max="3333"></div>
  </div>
  <p style="font-size:.7rem;color:#444;margin-top:8px;">All slots optional. Leave empty to skip.</p>
</div>

<div class="card">
  <h2>Center Text</h2>
  <div class="text-row">
    <div class="tfield">
      <label>Text</label>
      <input type="text" id="txt1" placeholder="GIRAFFIES CLUB" maxlength="30" oninput="drawPreview()">
    </div>
    <div class="ctrl">
      <label>Size</label>
      <input type="range" id="txtSize" min="24" max="110" value="60" oninput="document.getElementById('sizeVal').textContent=this.value+'px';drawPreview()">
      <div class="val" id="sizeVal">60px</div>
    </div>
  </div>
</div>

<div class="log" id="log"><span class="in">Ready! Fill in Token IDs and click Generate.</span></div>

<div class="canvas-wrap">
  <canvas id="cv" width="1500" height="500"></canvas>
</div>

<div class="actions">
  <button class="btn btn-purple" id="btnGen" onclick="doGenerate()">Generate Banner</button>
  <button class="btn btn-green" onclick="doDownload()">Download PNG</button>
</div>

}

function nftUrl(tokenId) {

  return "https://lh3.googleusercontent.com/d/" + fileId + "=w2000";

window.addEventListener("load", function() {
  var picker = document.getElementById("bgPicker");
  BGS.forEach(function(bg, i) {
    var wrap = document.createElement("div");
    wrap.className = "bg-thumb" + (i===0?" active":"");
    wrap.onclick = (function(idx){ return function(){ selectBg(idx); }; })(i);
    var cv = document.createElement("canvas");
    cv.width = 320; cv.height = 107;
    wrap.appendChild(cv);
    var lbl = document.createElement("span");
    lbl.textContent = bg.name;
    wrap.appendChild(lbl);
    picker.appendChild(wrap);
    var img = new Image();
    img.onload = function(){ cv.getContext("2d").drawImage(img,0,0,320,107); };
    img.src = bg.data;
  });
  drawPreview();
});

function selectBg(i) {
  selBg = i;
  document.querySelectorAll(".bg-thumb").forEach(function(el,j){
    el.className = "bg-thumb"+(j===i?" active":"");
  });
  drawPreview();
}

function addLog(msg, cls) {
  var box = document.getElementById("log");
  var d = document.createElement("div");
  d.className = cls||"in";
  d.textContent = msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function loadImg(src) {
  return new Promise(function(res,rej) {
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function(){ res(img); };
    img.onerror = function(){ rej(new Error("Failed to load")); };
    img.src = src;
  });
}

function placeGiraffe(ctx, img, layout) {
  var W = img.naturalWidth, H = img.naturalHeight;
  var scale = Math.min(layout.w/W, layout.h/H);
  var dw = Math.floor(W*scale), dh = Math.floor(H*scale);
  var dx = layout.anchor==="left" ? layout.x : layout.x+layout.w-dw;
  var dy = 500-dh;

  ctx.save();

  if (layout.anchor === "right") {
    ctx.translate(dx + dw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, W, H, 0, dy, dw, dh);
  } else {
    ctx.drawImage(img, 0, 0, W, H, dx, dy, dw, dh);
  }

  ctx.restore();
}

function drawCurvedText(ctx, text, fontSize) {
  if (!text) return;
  var radius = 900;
  ctx.save();
  ctx.font = "bold "+fontSize+"px 'Fredoka One', cursive";
  ctx.fillStyle = "#f9c74f";
  ctx.textBaseline = "alphabetic";
  ctx.shadowColor = "rgba(0,0,0,0.8)";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  var chars = text.split("");
  var widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
  var adjW = widths.map(function(w){ return w*0.85; });
  var totalAngle = adjW.reduce(function(a,b){ return a+b; },0)/radius;
  var arcCX = 750;
  var arcCY = 170+radius;
  var cur = -(totalAngle/2);
  for (var i=0; i<chars.length; i++) {
    var mid = cur+(adjW[i]/2)/radius;
    var angle = -Math.PI/2+mid;
    var x = arcCX+radius*Math.cos(angle);
    var y = arcCY+radius*Math.sin(angle);
    var yOff = (chars.length-1-i)*2.0;
    ctx.save();
    ctx.translate(x, y+yOff);
    ctx.rotate(mid);
    ctx.fillText(chars[i], -widths[i]/2, 0);
    ctx.restore();
    cur += adjW[i]/radius;
  }
  ctx.restore();
}

function drawPreview() {
  var img = new Image();
  img.onload = function() {
    var canvas = document.getElementById("cv");
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,1500,500);
    ctx.drawImage(img,0,0,1500,500);
    drawCurvedText(ctx,
      document.getElementById("txt1").value.trim(),
      parseInt(document.getElementById("txtSize").value));
  };
  img.src = BGS[selBg].data;
}

function doGenerate() {
  var ids = ["g0","g1","g2","g3"].map(function(id){
    return document.getElementById(id).value.trim();
  });
  var tasks = [];
  for (var i=0; i<4; i++) {
    if (ids[i] !== "") {
      var tid = parseInt(ids[i]);
      if (tid >= 1 && tid <= 3333) tasks.push({idx:i, id:tid});
      else addLog("Token "+ids[i]+" invalid (1-3333)","wn");
    }
  }
  if (!tasks.length) { addLog("Enter at least one Token ID!","wn"); return; }

  document.getElementById("btnGen").disabled = true;
  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,1500,500);

  var bgImg = new Image();
  bgImg.onload = function() {
    ctx.drawImage(bgImg,0,0,1500,500);
    addLog("Background OK","ok");
    var t = 0;
    function next() {
      if (t >= tasks.length) {
        drawCurvedText(ctx,
          document.getElementById("txt1").value.trim(),
          parseInt(document.getElementById("txtSize").value));
        addLog("Done! Click Download PNG.","ok");
        document.getElementById("btnGen").disabled = false;
        return;
      }
      var tid = tasks[t].id;
      var tidx = tasks[t].idx;
      t++;
      addLog("Loading giraffe #"+tid+"...","in");
      loadImg(nftUrl(tid))
        .then(function(img) {
          addLog("#"+tid+" OK","ok");
          placeGiraffe(ctx, img, LAYOUT[tidx]);
          next();
        })
        .catch(function(e) {
          addLog("#"+tid+" error: "+e.message,"er");
          next();
        });
    }
    next();
  };
  bgImg.src = BGS[selBg].data;
}

function doDownload() {
  try {
    var a = document.createElement("a");
    a.download = "giraffies-banner.png";
    a.href = document.getElementById("cv").toDataURL("image/png");
    a.click();
    addLog("Downloaded!","ok");
  } catch(e) {
    addLog("Download error: "+e.message,"er");
  }
}

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("txt1").addEventListener("input", drawPreview);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giraffies Club - Banner Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0f0f1a; min-height:100vh; font-family:Nunito,sans-serif; color:white; padding:24px 16px; }
h1 { font-family:"Fredoka One",cursive; font-size:2rem; text-align:center; color:#f9c74f; text-shadow:2px 2px 0 #333; margin-bottom:2px; }
.sub { text-align:center; color:#aaa; font-size:.82rem; margin-bottom:24px; letter-spacing:3px; text-transform:uppercase; }
.card { background:#1a1a2e; border:1px solid #2a2a4a; border-radius:14px; padding:18px; margin:0 auto 16px; max-width:860px; }
.card h2 { font-family:"Fredoka One",cursive; color:#f9c74f; font-size:1rem; margin-bottom:14px; }
.bg-picker { display:flex; gap:12px; flex-wrap:wrap; }
.bg-thumb { cursor:pointer; border-radius:8px; overflow:hidden; border:3px solid transparent; transition:border .2s; }
.bg-thumb canvas { display:block; }
.bg-thumb span { display:block; text-align:center; font-size:.7rem; padding:4px 6px; color:#888; background:#0f0f1a; }
.bg-thumb.active { border-color:#f9c74f; }
.bg-thumb.active span { color:#f9c74f; font-weight:700; }
.slots { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; }
.slot { background:#12122a; border:1px solid #2a2a4a; border-radius:10px; padding:12px; }
.slot .slabel { font-size:.65rem; color:#f9c74f; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
.slot .ssize { font-size:.6rem; color:#555; margin-bottom:8px; }
.slot input { width:100%; padding:8px; border-radius:8px; border:1.5px solid #2a2a4a; background:#0f0f1a; color:white; font-family:Nunito,sans-serif; font-weight:700; font-size:.9rem; text-align:center; outline:none; }
.slot input:focus { border-color:#f9c74f; }
.text-row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
.tfield { display:flex; flex-direction:column; gap:5px; flex:1; min-width:200px; }
.tfield label { font-size:.7rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.tfield input { padding:9px 12px; border-radius:8px; border:1.5px solid #2a2a4a; background:#0f0f1a; color:white; font-family:"Fredoka One",cursive; font-size:1.1rem; outline:none; }
.tfield input:focus { border-color:#f9c74f; }
.ctrl { display:flex; flex-direction:column; gap:5px; }
.ctrl label { font-size:.7rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.ctrl input[type=range] { width:130px; accent-color:#f9c74f; cursor:pointer; }
.val { font-size:.72rem; color:#f9c74f; font-weight:700; text-align:center; margin-top:2px; }
.cpicks { display:flex; gap:7px; flex-wrap:wrap; margin-top:2px; }
.cpick { width:28px; height:28px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:border .15s; flex-shrink:0; }
.cpick.active { border-color:white !important; }
.btn { padding:11px 28px; border-radius:50px; border:none; cursor:pointer; font-family:"Fredoka One",cursive; font-size:1rem; transition:all .2s; }
.btn-purple { background:linear-gradient(135deg,#7c3aed,#4a1d8c); color:white; }
.btn-green  { background:linear-gradient(135deg,#10b981,#059669); color:white; }
.btn:hover { transform:translateY(-2px); opacity:.9; }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; max-width:860px; margin:0 auto 16px; }
.canvas-wrap { max-width:860px; margin:0 auto 14px; border-radius:10px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.6); border:2px solid #2a2a4a; }
.canvas-wrap canvas { width:100%; height:auto; display:block; }
.log { max-width:860px; margin:0 auto 30px; background:#0a0a15; border-radius:8px; padding:10px 14px; font-size:.72rem; font-family:monospace; max-height:110px; overflow-y:auto; border:1px solid #1a1a3a; }
.ok{color:#4ade80;} .er{color:#f87171;} .in{color:#94a3b8;} .wn{color:#fbbf24;}
</style>
<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser/index.mjs";
window.removeBackgroundAI = removeBackground;
window.bgRemovalReady = true;
</script>
</head>
<body>
<h1>GIRAFFIES CLUB</h1>
<p class="sub">Banner Maker 1500 x 500</p>

<div class="card">
  <h2>Background</h2>
  <div class="bg-picker" id="bgPicker"></div>
</div>

<div class="card">
  <h2>Giraffes — Token IDs</h2>
  <div class="slots">
    <div class="slot">
      <div class="slabel">Far Left</div>
      <div class="ssize">Large</div>
      <input type="number" id="g0" placeholder="Token ID" min="1" max="3333">
    </div>
    <div class="slot">
      <div class="slabel">Mid Left</div>
      <div class="ssize">Medium</div>
      <input type="number" id="g1" placeholder="Token ID" min="1" max="3333">
    </div>
    <div class="slot">
      <div class="slabel">Mid Right</div>
      <div class="ssize">Medium</div>
      <input type="number" id="g2" placeholder="Token ID" min="1" max="3333">
    </div>
    <div class="slot">
      <div class="slabel">Far Right</div>
      <div class="ssize">Large</div>
      <input type="number" id="g3" placeholder="Token ID" min="1" max="3333">
    </div>
  </div>
  <p style="font-size:.7rem;color:#444;margin-top:10px;">All slots optional. Leave empty to skip.</p>
</div>

<div class="card">
  <h2>Center Text (curved)</h2>
  <div class="text-row">
    <div class="tfield">
      <label>Text</label>
      <input type="text" id="txt1" placeholder="GIRAFFIES CLUB" maxlength="30" oninput="drawPreview()">
    </div>
    <div class="ctrl">
      <label>Size</label>
      <input type="range" id="txtSize" min="24" max="110" value="60" oninput="document.getElementById('sizeVal').textContent=this.value+'px';drawPreview()">
      <div class="val" id="sizeVal">60px</div>
    </div>


  </div>
</div>

<div class="log" id="log"><span class="in">Ready. Fill in Token IDs and click Generate.</span></div>

<div class="canvas-wrap">
  <canvas id="cv" width="1500" height="500"></canvas>
</div>

<div class="actions">
  <button class="btn btn-purple" id="btnGen" onclick="generate()">Generate Banner</button>
  <button class="btn btn-green" onclick="dl()">Download PNG</button>
</div>

var LAYOUT = [
  { x:0,    w:420, h:420, anchor:"left"  },
  { x:330,  w:320, h:340, anchor:"left"  },
  { x:850,  w:320, h:340, anchor:"right" },
  { x:1080, w:420, h:420, anchor:"right" }
];

var selBg = 0;
var selColor = "#ffffff";

// Build background thumbnails
window.addEventListener("load", function() {
  var picker = document.getElementById("bgPicker");
  BGS.forEach(function(bg, i) {
    var wrap = document.createElement("div");
    wrap.className = "bg-thumb" + (i===0 ? " active" : "");
    wrap.onclick = (function(idx){ return function(){ selectBg(idx); }; })(i);

    var cv = document.createElement("canvas");
    cv.width = 240; cv.height = 80;
    cv.style.width = "160px";
    cv.style.height = "54px";
    wrap.appendChild(cv);

    var lbl = document.createElement("span");
    lbl.textContent = bg.name;
    wrap.appendChild(lbl);
    picker.appendChild(wrap);

    var img = new Image();
    img.onload = function() {
      cv.getContext("2d").drawImage(img, 0, 0, 240, 80);
    };
    img.src = bg.data;
  });

  drawPreview();
});

function selectBg(i) {
  selBg = i;
  document.querySelectorAll(".bg-thumb").forEach(function(el, j) {
    el.className = "bg-thumb" + (j === i ? " active" : "");
  });
  drawPreview();
}

function selectColor(c, el) {
  selColor = c;
  document.querySelectorAll(".cpick").forEach(function(e) { e.classList.remove("active"); });
  el.classList.add("active");
  drawPreview();
}

function addLog(msg, cls) {
  var box = document.getElementById("log");
  var d = document.createElement("div");
  d.className = cls || "in";
  d.textContent = msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function loadImg(src) {
  return new Promise(function(res, rej) {
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() { res(img); };
    img.onerror = function() { rej(new Error("Failed")); };
    img.src = src;
  });
}

// Convert img element to blob URL for AI bg removal
function imgToBlob(img) {
  var c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d").drawImage(img, 0, 0);
  return new Promise(function(res) { c.toBlob(res, "image/png"); });
}

function removeBgFallback(img) {
  var c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  var ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  return c;
}

function removeBgAI(img) {
  if (!window.removeBackgroundAI) return Promise.resolve(removeBgFallback(img));
  return imgToBlob(img)
    .then(function(blob) { return window.removeBackgroundAI(blob); })
    .then(function(resultBlob) {
      return new Promise(function(res) {
        var url = URL.createObjectURL(resultBlob);
        var out = new Image();
        out.onload = function() {
          var c = document.createElement("canvas");
          c.width = out.naturalWidth; c.height = out.naturalHeight;
          c.getContext("2d").drawImage(out, 0, 0);
          URL.revokeObjectURL(url);
          res(c);
        };
        out.src = url;
      });
    })
    .catch(function() { return removeBgFallback(img); });
}

function drawGiraffeCanvas(ctx, src, layout) {
  var W = src.width, H = src.height;
  var scale = Math.min(layout.w / W, layout.h / H);
  var dw = Math.floor(W * scale);
  var dh = Math.floor(H * scale);
  var dx = layout.anchor === "left" ? layout.x : layout.x + layout.w - dw;
  var dy = 500 - dh;
  ctx.drawImage(src, 0, 0, W, H, dx, dy, dw, dh);
}

// Draw text curved with belly UP (arc opens upward)
// The arc center is BELOW the text position
// radius = distance from arc center to text baseline
function drawCurvedText(ctx, text, bannerCX, bannerCY, radius, fontSize, color) {
  if (!text) return;
  ctx.save();
  ctx.font = "bold " + fontSize + "px 'Fredoka One', cursive";
  ctx.fillStyle = "#f9c74f";
  ctx.textBaseline = "alphabetic";
  ctx.shadowColor = "rgba(0,0,0,0.8)";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  // Arc center is below the text (so text curves upward, belly up)
  // Arc center Y = bannerCY + radius
  var arcCX = bannerCX;
  var arcCY = bannerCY + radius;

  // Measure each character width
  var chars = text.split("");
  var widths = chars.map(function(ch) { return ctx.measureText(ch).width; });
  var totalW = widths.reduce(function(a,b){ return a+b; }, 0);

  // Total angle subtended by text on the arc
  var totalAngle = totalW / radius;

  // Start angle: text is centered, arc goes from -PI/2 upward
  // At angle=0 from arc center going UP: position is directly above center
  // We use angles measured from the TOP of the arc (12 oclock = 0)
  // negative = left, positive = right
  var startAngle = -(totalAngle / 2);
  var curAngle = startAngle;

  // Tighter letter spacing: reduce each char width by 15%
  var spacing = 0.85;
  var adjustedWidths = widths.map(function(w){ return w * spacing; });
  var adjustedTotal = adjustedWidths.reduce(function(a,b){ return a+b; }, 0);
  totalAngle = adjustedTotal / radius;
  startAngle = -(totalAngle / 2);
  curAngle = startAngle;

  for (var i = 0; i < chars.length; i++) {
    var ch = chars[i];
    var hw = widths[i] / 2;
    var midAngle = curAngle + (adjustedWidths[i] / 2) / radius;

    var angle = -Math.PI / 2 + midAngle;
    var x = arcCX + radius * Math.cos(angle);
    var y = arcCY + radius * Math.sin(angle);

    // First letter lowest, each next letter slightly higher
    var yOffset = (chars.length - 1 - i) * 2.0;

    ctx.save();
    ctx.translate(x, y + yOffset);
    ctx.rotate(midAngle);
    ctx.fillText(ch, -hw, 0);
    ctx.restore();

    curAngle += adjustedWidths[i] / radius;
  }
  ctx.restore();
}

function drawText(ctx) {
  var t = document.getElementById("txt1").value.trim();
  if (!t) return;
  var size = parseInt(document.getElementById("txtSize").value);
  // Fixed radius = 900 (subtle curve, belly up)
  var radius = 900;
  // Text centered horizontally at 750, vertically around y=290 (slightly below center)
  // arcCY = textY + radius, so textY = arcCY - radius
  // We want text baseline around y=290
  drawCurvedText(ctx, t, 750, 170, radius, size, selColor);
}

function drawPreview() {
  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  var img = new Image();
  img.onload = function() {
    ctx.clearRect(0, 0, 1500, 500);
    ctx.drawImage(img, 0, 0, 1500, 500);
    drawText(ctx);
  };
  img.src = BGS[selBg].data;
}

function generate() {
  var ids = [
    document.getElementById("g0").value.trim(),
    document.getElementById("g1").value.trim(),
    document.getElementById("g2").value.trim(),
    document.getElementById("g3").value.trim()
  ];
  var tasks = [];
  for (var i = 0; i < 4; i++) { if (ids[i] !== "") tasks.push({idx:i, id:ids[i]}); }
  if (!tasks.length) { addLog("Enter at least one Token ID!", "wn"); return; }

  document.getElementById("btnGen").disabled = true;
  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 1500, 500);

  addLog("Loading background...", "in");
  var bgImg = new Image();
  bgImg.onload = function() {
    ctx.drawImage(bgImg, 0, 0, 1500, 500);
    addLog("Background OK", "ok");
    var t = 0;
    function next() {
      if (t >= tasks.length) {
        drawText(ctx);
        addLog("Done! Click Download PNG.", "ok");
        document.getElementById("btnGen").disabled = false;
        return;
      }
      var task = tasks[t++];
      addLog("Loading giraffe #" + task.id + "...", "in");
      loadImg(WORKER + "/" + task.id)
        .then(function(img) {
          addLog("#" + task.id + " OK", "ok");
          drawGiraffe(ctx, img, LAYOUT[task.idx]);
          next();
        })
        .catch(function(e) {
          addLog("#" + task.id + " error: " + e.message, "er");
          next();
        });
    }
    next();
  };
  bgImg.src = BGS[selBg].data;
}

function dl() {
  try {
    var a = document.createElement("a");
    a.download = "giraffies-banner.png";
    a.href = document.getElementById("cv").toDataURL("image/png");
    a.click();
    addLog("Downloaded!", "ok");
  } catch(e) {
    addLog("Download error: " + e.message, "er");
  }
}
</script>
